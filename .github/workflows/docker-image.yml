# Builds the Smartscope Session image for Intel/AMD NASes and publishes it
# to Docker Hub as <DOCKERHUB_USERNAME>/smartscope-session.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub personal access token with Read & Write permission).
name: Docker image

on:
  push:
    branches: [smartscope]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository != 'stevejcl/astro_dwarf_session'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Smoke test: build for this runner, start it, and load the dashboard.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: smartscope-session:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke --network host -e PORT=18765 smartscope-session:test
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:18765/; then
              curl -fs http://127.0.0.1:18765/ | grep -q "<title>Smartscope Session</title>" && echo "dashboard OK" && exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Check Docker Hub secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish the image."
            exit 1
          fi
          echo "IMAGE=docker.io/${DOCKERHUB_USERNAME,,}/smartscope-session" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=${DOCKERHUB_USERNAME,,}/smartscope-session" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Smartscope Session
            org.opencontainers.image.description=Automated imaging sessions for DWARF and ZWO Seestar smart telescopes

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Intel/AMD only (the target NAS is a DS425+). For ARM NASes add
      # linux/arm64 here plus a docker/setup-qemu-action step above.
      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub page: short description + overview from docker/DOCKERHUB.md.
      # Needs a token with Read, Write, Delete access; never blocks publishing.
      - name: Prepare Docker Hub overview
        run: sed "s|<this-image>|${IMAGE#docker.io/}|g" docker/DOCKERHUB.md > "$RUNNER_TEMP/DOCKERHUB.md"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_REPO }}
          short-description: "Automated imaging for DWARF & ZWO Seestar smart telescopes: web dashboard, scheduler, TonightPlan"
          readme-filepath: ${{ runner.temp }}/DOCKERHUB.md
